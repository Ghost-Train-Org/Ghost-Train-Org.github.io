<script>
const container = document.getElementById('container');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');

const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";

const zonesURL =
"https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json";

let zones = [];

async function listZones() {
    try {
        const response = await fetch(zonesURL);
        zones = await response.json();

        displayZones(zones);
    } catch (error) {
        container.innerHTML = "Failed to load games.";
        console.error(error);
    }
}

function displayZones(games) {
    container.innerHTML = "";

    games.forEach(game => {
        const item = document.createElement("div");
        item.className = "zone-item";

        const img = document.createElement("img");
        img.src = game.cover
            .replace("{COVER_URL}", coverURL)
            .replace("{HTML_URL}", htmlURL);

        const button = document.createElement("button");
        button.textContent = game.name;

        item.onclick = () => openGame(game);
        button.onclick = (e) => {
            e.stopPropagation();
            openGame(game);
        };

        item.appendChild(img);
        item.appendChild(button);

        container.appendChild(item);
    });
}

function openGame(game) {
    const url = game.url
        .replace("{COVER_URL}", coverURL)
        .replace("{HTML_URL}", htmlURL);

    fetch(url)
        .then(r => r.text())
        .then(html => {

            zoneFrame.contentDocument.open();
            zoneFrame.contentDocument.write(html);
            zoneFrame.contentDocument.close();

            document.getElementById("zoneName").textContent = game.name;

            zoneViewer.style.display = "flex";
        });
}

function closeZone() {
    zoneViewer.style.display = "none";
}

function fullscreenZone() {
    if (zoneFrame.requestFullscreen) {
        zoneFrame.requestFullscreen();
    }
}

function filterZones() {
    const query =
        document.getElementById("searchBar")
        .value
        .toLowerCase();

    const filtered = zones.filter(game =>
        game.name.toLowerCase().includes(query)
    );

    displayZones(filtered);
}

listZones();
</script>
