<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/freebuisness/gn-math-DONTDMCA@main/">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <script>
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault(); e.returnValue = '';
            return 'Are you sure you want to leave? Any unsaved changes will be lost.';
        });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WX5VS54ZDW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date()); gtag('config', 'G-WX5VS54ZDW');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gn-math</title>
    <meta name="title" content="GN-Math">
    <meta name="description" content="Play unbl*cked games like Crazy Cattle 3D and DriveMad on GN-Math. Fast, free, no downloads—perfect for school or home.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://gn-math.github.io/">
    <meta property="og:title" content="GN-Math">
    <meta property="og:description" content="Play unbl*cked games like Crazy Cattle 3D and DriveMad on GN-Math. Fast, free, no downloads—perfect for school or home.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://gn-math.github.io/">
    <meta name="twitter:title" content="GN-Math">
    <meta name="twitter:description" content="Play unbl*cked games like Crazy Cattle 3D and DriveMad on GN-Math. Fast, free, no downloads—perfect for school or home.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ff88">

    <style>
        :root {
            --green: #00ff88;
            --green-dim: rgba(0,255,136,0.15);
            --green-glow: 0 0 18px rgba(0,255,136,0.55);
            --bg: #000;
            --surface: #0a0a0a;
            --surface2: #111;
            --border: #00ff88;
            --border-dim: rgba(0,255,136,0.25);
            --text: #fff;
            --text-muted: #aaa;
            --font: 'Courier New', Courier, monospace;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #000;
            border-bottom: 1px solid var(--border-dim);
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo-block {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .logo-block img {
            width: 46px;
            filter: drop-shadow(var(--green-glow));
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--green);
            text-shadow: 0 0 20px rgba(0,255,136,0.7);
            text-transform: uppercase;
        }

        .search-container {
            display: flex;
            flex: 1;
            max-width: 560px;
            gap: 0.6rem;
        }

        #searchBar {
            flex: 1;
            padding: 0.7rem 1rem;
            background: #000;
            border: 2px solid var(--green);
            border-radius: var(--radius);
            color: #fff;
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: box-shadow 0.2s;
        }

        #searchBar:focus { box-shadow: var(--green-glow); }
        #searchBar::placeholder { color: #555; }

        select {
            padding: 0.7rem 0.8rem;
            background: #000;
            border: 2px solid var(--border-dim);
            border-radius: var(--radius);
            color: #aaa;
            font-family: var(--font);
            font-size: 13px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, color 0.2s;
        }

        select:hover, select:focus {
            border-color: var(--green);
            color: var(--green);
        }

        .control-buttons {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .control-button {
            width: 42px;
            height: 42px;
            background: none;
            border: 2px solid var(--border-dim);
            border-radius: var(--radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .control-button:hover {
            border-color: var(--green);
            box-shadow: var(--green-glow);
        }

        .control-button img {
            width: 22px;
            height: 22px;
            filter: invert(1) sepia(1) saturate(5) hue-rotate(95deg);
            transition: transform 0.4s;
        }

        .control-button:hover img { transform: rotate(40deg); }

        /* ── MAIN ── */
        main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem 6rem;
        }

        #zoneCount {
            font-size: 13px;
            color: var(--green);
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #zoneCount::before {
            content: '▶';
            font-size: 10px;
        }

        details summary {
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            color: var(--green);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0,255,136,0.4);
            user-select: none;
            padding: 0.3rem 0;
        }

        details summary:hover { text-shadow: 0 0 18px rgba(0,255,136,0.75); }

        hr {
            border: none;
            border-top: 1px solid var(--border-dim);
            margin: 1.5rem 0;
        }

        /* ── ZONE GRID ── */
        #container, #featuredZones {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.25rem;
            margin-top: 1rem;
        }

        .zone-item {
            background: var(--surface);
            border: 1px solid var(--border-dim);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
            position: relative;
        }

        .zone-item:hover {
            border-color: var(--green);
            box-shadow: 0 0 22px rgba(0,255,136,0.35);
            transform: translateY(-5px) scale(1.02);
        }

        .zone-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            background: #111;
            transition: transform 0.3s;
        }

        .zone-item:hover img { transform: scale(1.04); }

        .zone-item button {
            background: transparent;
            color: #ccc;
            border: 0;
            padding: 1rem 0.85rem;
            cursor: pointer;
            font-family: var(--font);
            font-weight: 700;
            font-size: 13px;
            text-align: center;
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            letter-spacing: 0.03em;
        }

        .zone-item:hover button { color: var(--green); }

        /* ── ZONE VIEWER ── */
        #zoneViewer {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .zone-header {
            height: 56px;
            background: #000;
            border-bottom: 2px solid var(--green);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            gap: 1rem;
        }

        .zone-title {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        #zoneName {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--green);
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #zoneId { display: none; }

        #zoneAuthor {
            font-size: 12px;
            color: #666;
            text-decoration: none;
            white-space: nowrap;
        }

        #zoneAuthor:hover { color: var(--green); }

        .info-button {
            background: none;
            border: none;
            cursor: pointer;
            color: #555;
            display: flex;
            align-items: center;
            padding: 2px;
            transition: color 0.2s;
        }

        .info-button:hover { color: var(--green); }

        .zone-controls {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        .zone-controls button {
            background: none;
            border: 2px solid var(--border-dim);
            color: var(--green);
            padding: 0.45rem 0.9rem;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 700;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .zone-controls button:hover {
            border-color: var(--green);
            box-shadow: var(--green-glow);
        }

        #zoneFrame {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
        }

        /* ── POPUP ── */
        #popupOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 1rem;
        }

        .popup {
            background: #0a0a0a;
            border: 2px solid var(--green);
            border-radius: var(--radius);
            box-shadow: 0 0 40px rgba(0,255,136,0.25);
            width: 100%;
            max-width: 520px;
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .popup-header {
            background: #000;
            border-bottom: 1px solid var(--border-dim);
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #popupTitle {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--green);
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        #popupClose {
            background: none;
            border: 2px solid var(--border-dim);
            color: var(--green);
            font-size: 1.2rem;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #popupClose:hover {
            border-color: var(--green);
            box-shadow: var(--green-glow);
        }

        #popupBody {
            padding: 1.25rem;
            overflow-y: auto;
            color: #ccc;
            font-size: 14px;
            line-height: 1.7;
        }

        #popupBody a { color: var(--green); }
        #popupBody b { color: #fff; }

        #popupBody input[type="text"],
        #popupBody input[type="file"] {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            background: #000;
            border: 2px solid var(--border-dim);
            border-radius: var(--radius);
            color: #fff;
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #popupBody input[type="text"]:focus,
        #popupBody input[type="file"]:focus {
            border-color: var(--green);
            box-shadow: var(--green-glow);
        }

        /* ── SETTINGS BUTTON ── */
        .settings-button {
            display: block;
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: none;
            border: 2px solid var(--border-dim);
            border-radius: var(--radius);
            color: var(--green);
            font-family: var(--font);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.04em;
            margin-bottom: 0.75rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
        }

        .settings-button:hover {
            border-color: var(--green);
            box-shadow: var(--green-glow);
        }

        /* ── FOOTER ── */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: #000;
            border-top: 1px solid var(--border-dim);
            padding: 0.75rem 1rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #555;
            text-decoration: none;
            font-size: 13px;
            font-family: var(--font);
            letter-spacing: 0.04em;
            transition: color 0.2s, text-shadow 0.2s;
        }

        .footer-links a:hover {
            color: var(--green);
            text-shadow: 0 0 8px rgba(0,255,136,0.6);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            header { flex-wrap: wrap; padding: 1rem; }
            .search-container { width: 100%; max-width: none; order: 3; }
            #container, #featuredZones {
                grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
            }
            .zone-controls button { font-size: 12px; padding: 0.4rem 0.65rem; }
        }

        @media (max-width: 480px) {
            #container, #featuredZones {
                grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-block">
        <img src="favicon.png" alt="gn-math logo">
        <span class="logo-text">gn-math</span>
    </div>

    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search zones..." oninput="filterZones()">
        <select id="sortOptions" onchange="sortZones()">
            <option value="name">Name</option>
            <option value="id">ID (Date)</option>
            <option value="popular">Popular</option>
            <option value="trendingDay">Trending (Day)</option>
            <option value="trendingWeek">Trending (Week)</option>
            <option value="trendingMonth">Trending (Month)</option>
        </select>
        <select id="filterOptions" onchange="filterZones2()">
            <option value="none">(SELECT TAG)</option>
        </select>
    </div>

    <div class="control-buttons">
        <button id="refresh" class="control-button" title="Refresh zones" onclick="listZones()">
            <img src="refresh-icon.png" alt="refresh">
        </button>
        <button id="settings" class="control-button" title="Settings">
            <img src="setting.png" alt="settings">
        </button>
    </div>
</header>

<main>
    <details id="featuredZonesWrapper" open>
        <summary id="allZonesSummary">Featured Zones</summary>
        <div id="featuredZones"></div>
    </details>

    <br><hr><br>

    <details id="allZonesWrapper" open>
        <summary id="allSummary">All Zones</summary>
        <div id="container">Loading...</div>
    </details>
</main>

<!-- Zone Viewer -->
<div id="zoneViewer">
    <div class="zone-header">
        <div class="zone-title">
            <h2 id="zoneName">Zone</h2>
            <button class="info-button" onclick="showZoneInfo()" title="Zone Information">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </button>
            <span id="zoneId" style="display:none;"></span>
            <a id="zoneAuthor" href="#" target="_blank">by Author</a>
        </div>
        <div class="zone-controls">
            <button onclick="fullscreenZone()">⛶ Fullscreen</button>
            <button onclick="aboutBlank()">↗ New Tab</button>
            <button onclick="downloadZone()">↓ Download</button>
            <button onclick="closeZone()">✕ Close</button>
        </div>
    </div>
    <iframe id="zoneFrame"></iframe>
</div>

<!-- Popup -->
<div id="popupOverlay">
    <div class="popup">
        <div class="popup-header">
            <h3 id="popupTitle">Title</h3>
            <button id="popupClose" onclick="closePopup()">×</button>
        </div>
        <div id="popupBody">Content will be here</div>
    </div>
</div>

<!-- Footer -->
<footer>
    <div class="footer-links">
        <a href="#" onclick="loadDMCA(); return false;">DMCA</a>
        <a href="#" onclick="showContact(); return false;">Contact</a>
        <a href="#" onclick="loadPrivacy(); return false;">Privacy Policy</a>
        <a href="javascript:saveData()">Export Data</a>
        <a href="#" onclick="document.getElementById('importData').click(); return false;">Import Data</a>
        <input type="file" id="importData" style="display:none;" onchange="loadData(event)">
    </div>
</footer>

<script>
const container = document.getElementById('container');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const searchBar = document.getElementById('searchBar');
const sortOptions = document.getElementById('sortOptions');
const filterOptions = document.getElementById('filterOptions');

const zonesurls = [
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json"
];
let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];
const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
let zones = [];
let popularityData = {};
const featuredContainer = document.getElementById('featuredZones');

function toTitleCase(str) {
    return str.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substring(1).toLowerCase());
}

async function listZones() {
    try {
        let sharesponse, shajson, sha;
        try { sharesponse = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t=" + Date.now()); } catch(e) {}
        if (sharesponse && sharesponse.status === 200) {
            try {
                shajson = await sharesponse.json();
                sha = shajson[0]['sha'];
                if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
            } catch(e) {
                try {
                    let r = await fetch("https://raw.githubusercontent.com/freebuisness/xml/refs/heads/main/sha.txt?t=" + Date.now());
                    if (r && r.status === 200) { sha = (await r.text()).trim(); if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`; }
                } catch(e2) {}
            }
        }
        const response = await fetch(zonesURL + "?t=" + Date.now());
        const json = await response.json();
        zones = json;
        zones[0].featured = true;
        await Promise.all([fetchPopularity("year"), fetchPopularity("month"), fetchPopularity("week"), fetchPopularity("day")]);
        sortZones();
        try {
            const search = new URLSearchParams(window.location.search);
            const id = search.get('id');
            const embed = window.location.hash.includes("embed");
            if (id) {
                const zone = zones.find(z => z.id + '' == id + '');
                if (zone) {
                    if (embed) {
                        if (zone.url.startsWith("http")) { window.open(zone.url, "_blank"); }
                        else {
                            const url = zone.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
                            fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
                                document.documentElement.innerHTML = html;
                                const popup = document.createElement("div");
                                popup.style.cssText = "position:fixed;bottom:20px;right:20px;background:#0a0a0a;color:#00ff88;padding:10px;border:1px solid #00ff88;border-radius:8px;font-family:monospace;box-shadow:0 0 15px rgba(0,255,136,0.3);";
                                popup.innerHTML = `Play more at <a href="https://gn-math.dev" target="_blank" style="color:#00ff88;font-weight:bold;">gn-math.dev</a>!`;
                                const closeBtn = document.createElement("button");
                                closeBtn.innerText = "✕"; closeBtn.style.cssText = "margin-left:10px;background:none;border:none;cursor:pointer;color:#00ff88;font-weight:bold;";
                                closeBtn.onclick = () => popup.remove();
                                popup.appendChild(closeBtn); document.body.appendChild(popup);
                                document.documentElement.querySelectorAll('script').forEach(old => {
                                    const s = document.createElement('script');
                                    if (old.src) s.src = old.src; else s.textContent = old.textContent;
                                    document.body.appendChild(s);
                                });
                            }).catch(err => alert("Failed to load zone: " + err));
                        }
                    } else { openZone(zone); }
                }
            }
        } catch(e) {}

        let alltags = [];
        for (const obj of json) { if (Array.isArray(obj.special)) alltags.push(...obj.special); }
        alltags = [...new Set(alltags)];
        let fo = document.getElementById("filterOptions");
        if (fo && fo.children.length > 1) { while (fo.children.length > 1) fo.removeChild(fo.lastElementChild); }
        for (const tag of alltags) {
            const opt = document.createElement("option");
            opt.value = tag; opt.textContent = toTitleCase(tag); fo.appendChild(opt);
        }
    } catch(error) {
        console.error(error);
        container.innerHTML = `<span style="color:#ff4455;">Error loading zones: ${error}</span>`;
    }
}

async function fetchPopularity(duration) {
    try {
        if (!popularityData[duration]) popularityData[duration] = {};
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration);
        const data = await response.json();
        data.forEach(file => {
            const m = file.name.match(/\/(\d+)\.html$/);
            if (m) popularityData[duration][parseInt(m[1])] = file.hits?.total ?? 0;
        });
    } catch(e) {
        if (!popularityData[duration]) popularityData[duration] = {};
        popularityData[duration][0] = 0;
    }
}

function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') zones.sort((a,b) => a.name.localeCompare(b.name));
    else if (sortBy === 'id') zones.sort((a,b) => a.id - b.id);
    else if (sortBy === 'popular') zones.sort((a,b) => ((popularityData['year']?.[b.id])??0) - ((popularityData['year']?.[a.id])??0));
    else if (sortBy === 'trendingMonth') zones.sort((a,b) => ((popularityData['month']?.[b.id])??0) - ((popularityData['month']?.[a.id])??0));
    else if (sortBy === 'trendingWeek') zones.sort((a,b) => ((popularityData['week']?.[b.id])??0) - ((popularityData['week']?.[a.id])??0));
    else if (sortBy === 'trendingDay') zones.sort((a,b) => ((popularityData['day']?.[b.id])??0) - ((popularityData['day']?.[a.id])??0));
    zones.sort((a,b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    if (featuredContainer.innerHTML === "") { displayFeaturedZones(zones.filter(z => z.featured)); }
    displayZones(zones);
}

function makeZoneItem(file) {
    const item = document.createElement("div");
    item.className = "zone-item";
    item.onclick = () => openZone(file);
    const img = document.createElement("img");
    img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    img.alt = file.name; img.loading = "lazy"; img.className = "lazy-zone-img";
    item.appendChild(img);
    const btn = document.createElement("button");
    btn.textContent = file.name;
    btn.onclick = e => { e.stopPropagation(); openZone(file); };
    item.appendChild(btn);
    return item;
}

function attachObserver(selector) {
    const imgs = document.querySelectorAll(selector + ' img.lazy-zone-img');
    const obs = new IntersectionObserver((entries, ob) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                ob.unobserve(img);
            }
        });
    }, { rootMargin: "100px", threshold: 0.1 });
    imgs.forEach(img => obs.observe(img));
}

function openZone(file) {
    if (file.url.startsWith("http")) { window.open(file.url, "_blank"); return; }
    const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(url + "?t=" + Date.now()).then(r => r.text()).then(html => {
        if (zoneFrame.contentDocument === null) {
            zoneFrame = document.createElement("iframe");
            zoneFrame.id = "zoneFrame";
            zoneViewer.appendChild(zoneFrame);
        }
        zoneFrame.contentDocument.open();
        zoneFrame.contentDocument.write(html);
        zoneFrame.contentDocument.close();
        document.getElementById('zoneName').textContent = file.name;
        document.getElementById('zoneId').textContent = file.id;
        document.getElementById('zoneAuthor').textContent = "by " + file.author;
        if (file.authorLink) document.getElementById('zoneAuthor').href = file.authorLink;
        zoneViewer.style.display = "flex";
        try {
            const u = new URL(window.location);
            u.searchParams.set('id', file.id);
            history.pushState(null, '', u.toString());
        } catch(e) {}
        zoneViewer.hidden = false;
    }).catch(err => alert("Failed to load zone: " + err));
}

function sanitizeData(obj, maxS=1000, maxA=10000) {
    if (typeof obj === 'string') return obj.length > maxS ? obj.slice(0,maxS)+'...[truncated]' : obj;
    if (obj instanceof Uint8Array) return obj.length > maxA ? `[Uint8Array too large (${obj.length} bytes)]` : obj;
    if (Array.isArray(obj)) return obj.map(i => sanitizeData(i,maxS,maxA));
    if (obj && typeof obj === 'object') { const n={}; for(const k in obj) if(obj.hasOwnProperty(k)) n[k]=sanitizeData(obj[k],maxS,maxA); return n; }
    return obj;
}

async function saveData() {
    alert("This might take a while, dont touch anything other than this OK button");
    const result = {};
    result.cookies = document.cookie;
    result.localStorage = {...localStorage};
    result.sessionStorage = {...sessionStorage};
    result.indexedDB = {};
    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
        if (!dbInfo.name) continue;
        result.indexedDB[dbInfo.name] = {};
        await new Promise((resolve, reject) => {
            const req = indexedDB.open(dbInfo.name, dbInfo.version);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => {
                const db = req.result;
                const storeNames = Array.from(db.objectStoreNames);
                if (!storeNames.length) { resolve(); return; }
                const tx = db.transaction(storeNames, "readonly");
                Promise.all(storeNames.map(sn => {
                    result.indexedDB[dbInfo.name][sn] = [];
                    return new Promise((res,rej) => {
                        const r2 = tx.objectStore(sn).getAll();
                        r2.onsuccess = () => { result.indexedDB[dbInfo.name][sn] = sanitizeData(r2.result,1000,100); res(); };
                        r2.onerror = () => rej(r2.error);
                    });
                })).then(resolve);
            };
        });
    }
    result.caches = {};
    const cacheNames = await caches.keys();
    for (const cn of cacheNames) {
        const cache = await caches.open(cn);
        result.caches[cn] = [];
        for (const req of await cache.keys()) {
            const resp = await cache.match(req); if (!resp) continue;
            const ct = resp.clone().headers.get('content-type') || '';
            let body;
            try {
                if (ct.includes('application/json')) body = await resp.clone().json();
                else if (ct.includes('text') || ct.includes('javascript')) body = await resp.clone().text();
                else body = btoa(String.fromCharCode(...new Uint8Array(await resp.clone().arrayBuffer())));
            } catch(e) { body = '[Unable to read body]'; }
            result.caches[cn].push({ url: req.url, body, contentType: ct });
        }
    }
    alert("Done, wait for the download to come");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: "application/octet-stream" }));
    link.download = `${Date.now()}.data`;
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
}

async function loadData(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) data.cookies.split(';').forEach(c => document.cookie = c.trim());
        if (data.localStorage) for (const k in data.localStorage) localStorage.setItem(k, data.localStorage[k]);
        if (data.sessionStorage) for (const k in data.sessionStorage) sessionStorage.setItem(k, data.sessionStorage[k]);
        if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
                const stores = data.indexedDB[dbName];
                await new Promise((resolve, reject) => {
                    const req = indexedDB.open(dbName, 1);
                    req.onupgradeneeded = e2 => {
                        const db = e2.target.result;
                        for (const sn in stores) if (!db.objectStoreNames.contains(sn)) db.createObjectStore(sn, {keyPath:'id',autoIncrement:true});
                    };
                    req.onsuccess = e2 => {
                        const db = e2.target.result;
                        const tx = db.transaction(Object.keys(stores),'readwrite');
                        tx.onerror = () => reject(tx.error);
                        let pending = Object.keys(stores).length;
                        for (const sn in stores) {
                            const os = tx.objectStore(sn);
                            os.clear().onsuccess = () => { for (const item of stores[sn]) os.put(item); if (--pending === 0) resolve(); };
                        }
                    };
                    req.onerror = () => reject(req.error);
                });
            }
        }
        if (data.caches) {
            for (const cn in data.caches) {
                const cache = await caches.open(cn);
                await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k))));
                for (const entry of data.caches[cn]) {
                    let rb;
                    if (entry.contentType.includes('application/json')) rb = JSON.stringify(entry.body);
                    else if (entry.contentType.includes('text') || entry.contentType.includes('javascript')) rb = entry.body;
                    else { const b = atob(entry.body); const bytes = new Uint8Array(b.length); for(let i=0;i<b.length;i++) bytes[i]=b.charCodeAt(i); rb=bytes.buffer; }
                    await cache.put(entry.url, new Response(rb, { headers: new Headers({'content-type':entry.contentType}) }));
                }
            }
        }
        alert("Data loaded");
    };
    alert("This might take a while, dont touch anything other than this OK button");
    reader.readAsText(file);
}

let _allStatsCache = null;

async function getAllStats() {
    if (_allStatsCache) return _allStatsCache;
    const BASE_URL = "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files";
    let page = 1, done = false;
    const combinedMap = Object.create(null);
    while (!done) {
        const pages = Array.from({length:5},(_,i)=>page+i);
        const responses = await Promise.all(pages.map(p => fetch(`${BASE_URL}?period=year&page=${p}&limit=100`).then(r=>r.ok?r.json():[])));
        for (const data of responses) {
            if (!Array.isArray(data) || !data.length) { done=true; break; }
            for (const item of data) {
                if (!item?.name) continue;
                const m = item.name.match(/^\/(\d+)([.-])/); if (!m) continue;
                const id = m[1];
                if (!combinedMap[id]) combinedMap[id] = {hits:0,bandwidth:0};
                combinedMap[id].hits += item.hits?.total ?? 0;
                combinedMap[id].bandwidth += item.bandwidth?.total ?? 0;
            }
        }
        page += 5;
    }
    _allStatsCache = combinedMap; return combinedMap;
}

async function getStats(id) {
    const allStats = await getAllStats();
    return allStats[String(id)]?.hits ?? 0;
}
